version: "3.9"

services:
  backend:
    image: python:3.14-rc-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      bash -c "pip install --upgrade pip && pip install -r requirements.txt && python wsgi.py"
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pkmn-assistant
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
    depends_on:
      - minio
      - minio-init

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend/pkmn-assistant:/app
    command: >
      sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.docker.json"
    ports:
      - "4200:4200"
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/pkmn-assistant || true
      "

volumes:
  minio-data:
